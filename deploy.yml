apiVersion: apps/v1
kind: Deployment
metadata:
  name: clicknvape-backend-dev
  labels:
    app: clicknvape-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clicknvape-backend
  template:
    metadata:
      labels:
        app: clicknvape-backend
    spec:
      containers:
        - name: backend
          image: roh666/clicknvape-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: clicknvape-config
            - secretRef:
                name: clicknvape-secret
---
# --- Service backend (ClusterIP interne) ---
apiVersion: v1
kind: Service
metadata:
  name: clicknvape-backend
spec:
  type: NodePort  
  selector:
    app: clicknvape-backend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31000
---


